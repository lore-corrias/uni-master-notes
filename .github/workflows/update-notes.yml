name: Build PDF and release them

on:
  push:
    branches:
      - v4
    paths:
      - 'content/**'
      - '.github/workflows/update-notes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -----------------------------------------------------
  # JOB 1: Build PDFs for each course
  # -----------------------------------------------------
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PDF_OUTPUT_DIR: /tmp/pdfs-outputs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build all course PDFs
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/content:/data/content" \
            --volume "$PDF_OUTPUT_DIR:/tmp/pdfs" \
            $(docker build "${GITHUB_WORKSPACE}/pdf-builders" -q) "/data/content" "/tmp/pdfs"

      - name: Generate release notes
        run: |
          echo "## 📚 Latest Course Notes" > release_notes.md
          echo "" >> release_notes.md
          echo "This release contains the latest auto-generated PDF files:" >> release_notes.md
          echo "" >> release_notes.md
          
          # Loop through the built PDFs and add them as a Markdown list
          for f in $PDF_OUTPUT_DIR/*.pdf; do
            echo "- **$(basename $f)**" >> release_notes.md
          done
          
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "Built from commit: \`${{ github.sha }}\`" >> release_notes.md

      - name: Upload all PDFs to "latest" Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: "latest-pdf"
          name: "Latest Course Notes (PDFs)"
          body_path: "release_notes.md" 
          files: ${{ env.PDF_OUTPUT_DIR }}/*.pdf
